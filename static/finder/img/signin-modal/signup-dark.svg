<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none">
  <defs>
    <linearGradient id="g1" x1="80" y1="100" x2="560" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4312f4"/>
      <stop offset=".5" stop-color="#9a43ff"/>
      <stop offset="1" stop-color="#fd5631"/>
    </linearGradient>
    <linearGradient id="card" x1="170" y1="180" x2="470" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".025"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <circle cx="320" cy="280" r="215" fill="url(#g1)" opacity=".08"/>
  <circle cx="430" cy="170" r="120" fill="#4312f4" opacity=".12" filter="url(#blur)"/>
  <circle cx="190" cy="390" r="120" fill="#fd5631" opacity=".10" filter="url(#blur)"/>

  <!-- creator network -->
  <g stroke="url(#g1)" stroke-width="2" opacity=".55">
    <path d="M110 155L205 205L320 140L435 205L530 155"/>
    <path d="M110 405L205 355L320 420L435 355L530 405"/>
    <path d="M205 205L205 355M435 205L435 355M320 140V420"/>
    <path d="M205 205L320 280L435 205M205 355L320 280L435 355"/>
  </g>

  <!-- floating creator nodes -->
  <g fill="#15121c" stroke="url(#g1)" stroke-width="4" filter="url(#glow)">
    <circle cx="110" cy="155" r="15"/><circle cx="530" cy="155" r="15"/>
    <circle cx="110" cy="405" r="15"/><circle cx="530" cy="405" r="15"/>
    <circle cx="205" cy="205" r="12"/><circle cx="435" cy="205" r="12"/>
    <circle cx="205" cy="355" r="12"/><circle cx="435" cy="355" r="12"/>
  </g>

  <!-- profile card -->
  <rect x="195" y="170" width="250" height="220" rx="30" fill="#0f0e14" stroke="#fff" stroke-opacity=".12"/>
  <rect x="205" y="180" width="230" height="200" rx="23" fill="url(#card)"/>

  <!-- avatar -->
  <circle cx="320" cy="240" r="44" fill="url(#g1)"/>
  <circle cx="320" cy="232" r="15" fill="#fff" fill-opacity=".92"/>
  <path d="M291 270C300 249 340 249 349 270" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".92"/>

  <!-- creator stats -->
  <rect x="255" y="306" width="130" height="12" rx="6" fill="#fff" opacity=".16"/>
  <rect x="280" y="328" width="80" height="9" rx="4.5" fill="url(#g1)"/>
  <circle cx="250" cy="332" r="7" fill="#fd5631"/>
  <circle cx="390" cy="332" r="7" fill="#4312f4"/>

  <!-- spark -->
  <g filter="url(#glow)">
    <path d="M475 275L486 301L512 312L486 323L475 349L464 323L438 312L464 301L475 275Z" fill="url(#g1)"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="320" y="455" fill="#fff" fill-opacity=".9" font-size="18" font-weight="700" letter-spacing="4">CREATE • CONNECT • WIN</text>
    <text x="320" y="480" fill="#fff" fill-opacity=".4" font-size="10" letter-spacing="3">BUILD YOUR INFLUENCE NETWORK</text>
  </g>
</svg>
