<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none">
  <defs>
    <linearGradient id="g1" x1="80" y1="80" x2="560" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fd5631"/>
      <stop offset=".52" stop-color="#8c45ff"/>
      <stop offset="1" stop-color="#4312f4"/>
    </linearGradient>
    <linearGradient id="g2" x1="190" y1="170" x2="470" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".03"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <circle cx="320" cy="280" r="220" fill="url(#g1)" opacity=".08"/>
  <circle cx="320" cy="280" r="150" fill="#fd5631" opacity=".08" filter="url(#blur)"/>

  <!-- influence orbit -->
  <g opacity=".5" stroke="url(#g1)" stroke-width="2">
    <ellipse cx="320" cy="280" rx="245" ry="125" transform="rotate(-18 320 280)"/>
    <ellipse cx="320" cy="280" rx="190" ry="190" transform="rotate(28 320 280)"/>
    <ellipse cx="320" cy="280" rx="118" ry="235" transform="rotate(72 320 280)"/>
  </g>

  <!-- connection network -->
  <g stroke="url(#g1)" stroke-width="2" opacity=".6">
    <path d="M100 150L205 235L320 120L435 235L540 150"/>
    <path d="M100 410L205 325L320 440L435 325L540 410"/>
    <path d="M205 235L205 325M435 235L435 325M320 120V440"/>
  </g>

  <!-- nodes -->
  <g fill="#17131f" stroke="url(#g1)" stroke-width="4" filter="url(#glow)">
    <circle cx="100" cy="150" r="14"/><circle cx="540" cy="150" r="14"/>
    <circle cx="100" cy="410" r="14"/><circle cx="540" cy="410" r="14"/>
    <circle cx="205" cy="235" r="11"/><circle cx="435" cy="235" r="11"/>
    <circle cx="205" cy="325" r="11"/><circle cx="435" cy="325" r="11"/>
    <circle cx="320" cy="120" r="12"/><circle cx="320" cy="440" r="12"/>
  </g>

  <!-- central glass portal -->
  <circle cx="320" cy="280" r="104" fill="#101016" stroke="url(#g1)" stroke-width="3"/>
  <circle cx="320" cy="280" r="88" fill="url(#g2)" stroke="#fff" stroke-opacity=".1"/>
  <circle cx="320" cy="280" r="70" fill="#15131d" stroke="#fff" stroke-opacity=".08"/>

  <!-- lock -->
  <rect x="278" y="276" width="84" height="68" rx="18" fill="url(#g1)"/>
  <path d="M296 278V258C296 231 344 231 344 258V278" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="320" cy="308" r="8" fill="#fff"/>
  <path d="M320 316V329" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

  <!-- tiny media/influence glyphs -->
  <g fill="#fff" opacity=".8">
    <circle cx="86" cy="245" r="4"/><circle cx="554" cy="315" r="4"/>
    <circle cx="265" cy="92" r="4"/><circle cx="375" cy="468" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="320" y="505" fill="#fff" fill-opacity=".9" font-size="18" font-weight="700" letter-spacing="4">WINJOB</text>
    <text x="320" y="528" fill="#fff" fill-opacity=".4" font-size="10" letter-spacing="3">YOUR INFLUENCE • YOUR WIN</text>
  </g>
</svg>
