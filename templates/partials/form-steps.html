<!-- Inline steps: Light version -->
<div class="steps steps-light" style="margin: 2rem">
    <div class="step {% if step >= 1 %}active{% endif %}">
        <div class="step-progress">
            <span class="step-progress-start"></span>
            <span class="step-progress-end"></span>
            <span class="step-number">1</span>
        </div>
        <div class="step-label">{{ step_name1 }}</div>
    </div>
    <div class="step {% if step >= 2 %}active{% endif %}">
        <div class="step-progress">
            <span class="step-progress-start"></span>
            <span class="step-progress-end"></span>
            <span class="step-number">2</span>
        </div>
        <div class="step-label">{{ step_name2 }}</div>
    </div>
    <div class="step {% if step >= 3 %}active{% endif %}">
        <div class="step-progress">
            <span class="step-progress-start"></span>
            <span class="step-progress-end"></span>
            <span class="step-number">3</span>
        </div>
        <div class="step-label">{{ step_name3 }}</div>
    </div>
    <div class="step {% if step >= 4 %}active{% endif %}">
        <div class="step-progress">
            <span class="step-progress-start"></span>
            <span class="step-progress-end"></span>
            <span class="step-number">4</span>
        </div>
        <div class="step-label">{{ step_name4 }}</div>
    </div>
</div>
