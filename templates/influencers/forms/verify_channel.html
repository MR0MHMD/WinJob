{% extends 'parent/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="card card-light">
        <div class="card-body text-center">
            <h4 class="text-light">تأیید کانال {{ channel.channel_name }}</h4>
            <p class="text-muted">لطفاً کد زیر را در صفحه کانال خود (در بخش بیوگرافی، توضیحات یا هر جای قابل مشاهده) قرار دهید.</p>
            <div class="bg-dark p-3 rounded mb-4">
                <code class="fs-1 text-primary" style="font-size: 2rem;">{{ verification_code }}</code>
            </div>
            <p class="text-muted small">سپس روی دکمه «بررسی کانال» کلیک کنید.</p>
            <button id="checkBtn" class="btn btn-primary px-5">بررسی کانال</button>
            <div id="result" class="mt-3"></div>
        </div>
    </div>
</div>
<script>
document.getElementById('checkBtn').onclick = function() {
    const btn = this;
    btn.disabled = true;
    btn.innerHTML = 'در حال بررسی...';
    fetch('{% url "influencers:start_verification" channel.id %}', {
        method: 'POST',
        headers: {'X-CSRFToken': '{{ csrf_token }}'}
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'pending') {
            document.getElementById('result').innerHTML = '<div class="alert alert-info">' + data.message + ' نتیجه طی چند ثانیه اعلام می‌شود.</div>';
            // در صورت نیاز می‌توانید هر ۵ ثانیه یکبار با یه API دیگه وضعیت رو چک کنید
            // فعلاً کاربر را به صفحه جزئیات کانال هدایت می‌کنیم
            setTimeout(() => location.href = '{% url "influencers:channel_detail" channel.id %}', 3000);
        } else if (data.status === 'error') {
            document.getElementById('result').innerHTML = '<div class="alert alert-danger">' + data.message + '</div>';
            btn.disabled = false;
            btn.innerHTML = 'بررسی کانال';
        } else {
            document.getElementById('result').innerHTML = '<div class="alert alert-success">' + data.message + '</div>';
            setTimeout(() => location.href = '{% url "influencers:channel_detail" channel.id %}', 2000);
        }
    })
    .catch(err => {
        document.getElementById('result').innerHTML = '<div class="alert alert-danger">خطا در ارتباط با سرور</div>';
        btn.disabled = false;
        btn.innerHTML = 'بررسی کانال';
    });
};
</script>
{% endblock %}
