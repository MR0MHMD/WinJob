{% if page_obj.has_other_pages %}
    <nav class="d-flex justify-content-center align-items-center gap-3 mt-4"
         aria-label="صفحه‌بندی">
        {% if page_obj.has_previous %}
            <a class="btn btn-outline-light btn-sm"
               href="?page={{ page_obj.previous_page_number }}&q={{ query|urlencode }}&status={{ status|urlencode }}">قبلی</a>
        {% endif %}
        <span class="text-light">{{ page_obj.number }} از {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next %}
            <a class="btn btn-outline-light btn-sm"
               href="?page={{ page_obj.next_page_number }}&q={{ query|urlencode }}&status={{ status|urlencode }}">بعدی</a>
        {% endif %}
    </nav>
{% endif %}
