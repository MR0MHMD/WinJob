<div class="{% if field.name == 'is_active' or field.name == 'DELETE' %}form-check form-switch{% else %}mb-3{% endif %}">
    {% if field.name == 'is_active' or field.name == 'DELETE' %}
        {{ field }}<label class="form-check-label text-light" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% else %}
        <label class="form-label text-light" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-primary" aria-hidden="true">*</span>{% endif %}</label>
        {{ field }}
    {% endif %}
    {% if field.help_text %}<div class="form-text text-muted">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div class="text-danger small mt-1" role="alert">{{ error }}</div>{% endfor %}
</div>
